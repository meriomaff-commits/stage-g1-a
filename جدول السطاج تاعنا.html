<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Calendrier de Stage — G2 (2026/2027)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg1:#0a0e27; --bg2:#1a1f4a;
    --accent:#00e5ff; --accent2:#ff00e5; --gold:#ffd700;
    --stage-t:#00ff88; --stage-mi:#ffaa00;
  }
  body{
    font-family:'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 50%, #0a0e27 100%);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    min-height:100vh; color:#fff; overflow-x:hidden;
  }
  @keyframes bgShift{ 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  body::before{
    content:''; position:fixed; inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(2px 2px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 33% 80%, #fff, transparent),
      radial-gradient(1px 1px at 15% 90%, #fff, transparent);
    background-size:200% 200%; animation: stars 60s linear infinite;
    opacity:.5; pointer-events:none; z-index:0;
  }
  @keyframes stars{ from{background-position:0 0} to{background-position:200% 200%} }
  .container{ position:relative; z-index:1; max-width:1600px; margin:0 auto; padding:20px; }
  header{ text-align:center; padding:40px 20px 20px; }
  h1{
    font-size:clamp(1.8rem, 5vw, 3.2rem); font-weight:900;
    background:linear-gradient(90deg, var(--accent), var(--accent2), var(--gold), var(--accent));
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation: gradientText 4s linear infinite;
    text-shadow: 0 0 40px rgba(0,229,255,.4); letter-spacing:2px;
  }
  @keyframes gradientText{ 0%{background-position:0% 50%} 100%{background-position:300% 50%} }
  .subtitle{ margin-top:10px; color:#a0b4d0; font-size:1.05rem; letter-spacing:3px; text-transform:uppercase; }
  .group-title{
    text-align:center; font-size:1.4rem; margin:20px 0 30px;
    color:var(--gold); letter-spacing:2px; animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow{ 0%,100%{ text-shadow:0 0 10px rgba(255,215,0,.5); } 50%{ text-shadow:0 0 30px rgba(255,215,0,1), 0 0 50px rgba(255,215,0,.6); } }
  .year-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 20px; }
  .month-card{
    background: rgba(20,25,60,.6); border: 1px solid rgba(0,229,255,.2);
    border-radius: 16px; padding: 15px; backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,229,255,.1); transition: .3s;
    animation: fadeInUp .6s ease;
  }
  .month-card:hover{ border-color: rgba(0,229,255,.6); box-shadow: 0 0 40px rgba(0,229,255,.25); transform: translateY(-5px); }
  .month-title{
    text-align: center; font-size: 1.2rem; font-weight: 800; color: var(--accent);
    margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(0,229,255,.5);
  }
  .weekdays{ display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; margin-bottom: 6px; text-align: center; }
  .weekdays div{ font-size: 0.65rem; font-weight: 700; color: #6a8aa8; padding: 4px 0; text-transform: uppercase; }
  .days-grid{ display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; }
  .day{
    aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 600; background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.05); color: #8a9ab0;
    position: relative; transition: .2s; cursor: default;
  }
  .day.empty{ background: transparent; border: none; }
  .day.stage{
    cursor: pointer; background: linear-gradient(135deg, rgba(0,255,136,.3), rgba(0,229,255,.2));
    border: 1px solid var(--stage-t); box-shadow: 0 0 10px rgba(0,255,136,.4);
    color: #fff; font-weight: 800; animation: stagePulse 2s ease-in-out infinite; z-index: 2;
  }
  .day.stage:hover{ transform: scale(1.25); box-shadow: 0 0 25px var(--stage-t); z-index: 10; }
  @keyframes stagePulse{ 0%,100%{ box-shadow: 0 0 8px rgba(0,255,136,.4); } 50%{ box-shadow: 0 0 18px rgba(0,255,136,.8); } }
  .day.stage-mi{
    background: linear-gradient(135deg, rgba(255,170,0,.35), rgba(255,215,0,.2));
    border: 1px solid var(--stage-mi); box-shadow: 0 0 10px rgba(255,170,0,.5);
    color: #fff; font-weight: 800; animation: stagePulseMi 2s ease-in-out infinite;
  }
  .day.stage-mi:hover{ transform: scale(1.25); box-shadow: 0 0 25px var(--stage-mi); z-index: 10; }
  @keyframes stagePulseMi{ 0%,100%{ box-shadow: 0 0 8px rgba(255,170,0,.4); } 50%{ box-shadow: 0 0 18px rgba(255,170,0,.8); } }
  .day .icon{
    position: absolute; top: -4px; right: -4px; font-size: 0.8rem;
    filter: drop-shadow(0 0 3px #fff); animation: iconBounce 1.5s ease-in-out infinite;
  }
  @keyframes iconBounce{ 0%,100%{ transform: translateY(0) scale(1); } 50%{ transform: translateY(-3px) scale(1.2); } }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,8,20,.85); backdrop-filter:blur(8px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
    opacity:0; transition:opacity .3s;
  }
  .modal-overlay.show{ display:flex; opacity:1; }
  .modal{
    background:linear-gradient(145deg, #151a3a, #0d1230); border:2px solid var(--accent);
    border-radius:24px; padding:40px 30px; max-width:520px; width:100%; text-align:center;
    position:relative; box-shadow:0 0 80px rgba(0,229,255,.5), inset 0 0 40px rgba(0,229,255,.08);
    animation: modalPop .5s cubic-bezier(.68,-0.55,.27,1.55); overflow:hidden;
  }
  .modal::before{
    content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background:conic-gradient(from 0deg, transparent, rgba(0,229,255,.15), transparent, rgba(255,0,229,.15), transparent);
    animation: rotateGlow 6s linear infinite; z-index:0;
  }
  @keyframes rotateGlow{ to{ transform:rotate(360deg); } }
  @keyframes modalPop{ from{ opacity:0; transform:scale(.7) translateY(30px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  .modal > *{ position:relative; z-index:1; }
  .modal .close-btn{
    position:absolute; top:15px; right:18px; background:none; border:none;
    color:#fff; font-size:1.8rem; cursor:pointer; transition:.3s; line-height:1;
  }
  .modal .close-btn:hover{ color:var(--accent2); transform:rotate(90deg) scale(1.2); }
  .modal .modal-icon{
    font-size:4rem; margin-bottom:10px; animation: floatIcon 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px var(--gold));
  }
  @keyframes floatIcon{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-12px); } }
  .modal h2{ font-size:1.6rem; color:var(--gold); margin-bottom:6px; text-shadow:0 0 20px rgba(255,215,0,.6); }
  .modal .full-date{ color:var(--accent); font-size:1.1rem; margin-bottom:20px; font-weight:600; letter-spacing:1px; }
  .modal .info-line{
    background:rgba(0,229,255,.08); border-left:4px solid var(--accent); border-radius:10px;
    padding:14px 18px; margin:12px 0; text-align:left; display:flex; align-items:center;
    gap:12px; font-size:1rem; animation: slideIn .5s ease;
  }
  @keyframes slideIn{ from{ opacity:0; transform:translateX(-20px); } to{ opacity:1; transform:translateX(0); } }
  .modal .info-line .label{ color:#8aa0c0; font-size:.8rem; text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:2px; }
  .modal .info-line .value{ color:#fff; font-weight:700; font-size:1.05rem; }
  .modal .info-line .emoji{ font-size:1.6rem; }
  .legend{
    display:flex; justify-content:center; gap:20px; flex-wrap:wrap;
    margin-top:25px; font-size:.85rem; color:#a0b4d0; padding-bottom: 40px;
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:14px; height:14px; border-radius:50%; display:inline-block; }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  @media(max-width:600px){
    .year-grid{ grid-template-columns: 1fr; }
    .day { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>✦ CALENDRIER DE STAGE ✦</h1>
    <p class="subtitle">Médecine — Groupe G2 — Planning 2026/2027</p>
  </header>

  <div class="group-title">— GROUPE G2 —</div>

  <div class="year-grid" id="yearGrid"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--stage-t);box-shadow:0 0 10px var(--stage-t)"></i> Spécialités T</span>
    <span><i class="dot" style="background:var(--stage-mi);box-shadow:0 0 10px var(--stage-mi)"></i> Médecine Interne</span>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ============ البيانات (سنة 2026/2027) ============ */
const stages = [
  // Spécialités T (4 jours : Dim -> Mer)
  { start:'2026-11-08', end:'2026-11-11', type:'T', label:'T1', place:'Psychiatrie C — CHU Blida' },
  { start:'2027-01-03', end:'2027-01-06', type:'T', label:'T10', place:'MPR — CHU Blida' },
  { start:'2027-02-14', end:'2027-02-17', type:'T', label:'T7', place:'Anesthésie Réa — TOT Blida' },
  { start:'2027-04-04', end:'2027-04-07', type:'T', label:'T5', place:'Chirurgie Maxillo-Faciale — CHU Douera' },
  { start:'2027-04-18', end:'2027-04-21', type:'T', label:'T4', place:'Chirurgie Générale — CHU Douera' },
  { start:'2027-05-02', end:'2027-05-05', type:'T', label:'T3', place:'Gynécologie — CHU Blida' },
  { start:'2027-05-16', end:'2027-05-19', type:'T', label:'T2', place:'Chirurgie Orthopédique — CHU Blida' },

  // Médecine Interne (2 jours)
  // 22 Nov 2026 = Dimanche, 23 = Lundi
  { start:'2026-11-22', end:'2026-11-23', type:'MI', label:'MI', place:'Médecine Interne — Douera (Dim + Lun)' },
  // 6 Dec 2026 = Dimanche, 7 = Lundi
  { start:'2026-12-06', end:'2026-12-07', type:'MI', label:'MI', place:'Médecine Interne — Blida (Dim + Lun)' },
  // 16 Mar 2027 = Mardi, 17 = Mercredi
  { start:'2027-03-16', end:'2027-03-17', type:'MI', label:'MI', place:'Médecine Interne — Douera (Mar + Mer)' },
  // 13 Avr 2027 = Mardi, 14 = Mercredi (لأن 11 أفريل 2027 هو الأحد وليس الثلاثاء)
  { start:'2027-04-13', end:'2027-04-14', type:'MI', label:'MI', place:'Médecine Interne — Blida (Mar + Mer)' },
];

const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

function parseDate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y, m-1, d); }
function toKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatFullDate(d){ return `${DAYS_FR[d.getDay()]} ${d.getDate()} ${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`; }

function buildDayMap(){
  const map = {};
  stages.forEach(ev => {
    const s = parseDate(ev.start), e = parseDate(ev.end);
    let cur = new Date(s);
    while(cur <= e){
      const k = toKey(cur);
      if(!map[k]) map[k] = [];
      map[k].push({ type: ev.type, label: ev.label, place: ev.place, date: new Date(cur) });
      cur.setDate(cur.getDate()+1);
    }
  });
  return map;
}
const dayMap = buildDayMap();

function renderFullYear(){
  const yearGrid = document.getElementById('yearGrid');
  yearGrid.innerHTML = '';

  // السنة الدراسية 2026/2027 : من سبتمبر 2026 إلى أوت 2027
  const monthsToShow = [
    { year: 2026, month: 8 },  // Septembre 2026
    { year: 2026, month: 9 },  // Octobre
    { year: 2026, month: 10 }, // Novembre
    { year: 2026, month: 11 }, // Décembre
    { year: 2027, month: 0 },  // Janvier 2027
    { year: 2027, month: 1 },  // Février
    { year: 2027, month: 2 },  // Mars
    { year: 2027, month: 3 },  // Avril
    { year: 2027, month: 4 },  // Mai
    { year: 2027, month: 5 },  // Juin
    { year: 2027, month: 6 },  // Juillet
    { year: 2027, month: 7 },  // Août
  ];

  monthsToShow.forEach(m => {
    const monthCard = document.createElement('div');
    monthCard.className = 'month-card';

    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = `${MONTHS_FR[m.month]} ${m.year}`;
    monthCard.appendChild(title);

    const weekdays = document.createElement('div');
    weekdays.className = 'weekdays';
    // ترتيب الأيام: الأحد أولاً
    ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'].forEach(d => {
      const wd = document.createElement('div');
      wd.textContent = d;
      weekdays.appendChild(wd);
    });
    monthCard.appendChild(weekdays);

    const daysGrid = document.createElement('div');
    daysGrid.className = 'days-grid';

    const firstDay = new Date(m.year, m.month, 1);
    const lastDay = new Date(m.year, m.month+1, 0);
    const startOffset = firstDay.getDay(); // 0 = Dimanche
    const totalDays = lastDay.getDate();

    for(let i=0; i<startOffset; i++){
      const el = document.createElement('div');
      el.className = 'day empty';
      daysGrid.appendChild(el);
    }

    for(let day=1; day<=totalDays; day++){
      const dateObj = new Date(m.year, m.month, day);
      const key = toKey(dateObj);
      const events = dayMap[key] || [];

      const el = document.createElement('div');
      el.className = 'day';
      el.textContent = day;

      if(events.length > 0){
        const hasMI = events.some(e=>e.type==='MI');
        const hasT = events.some(e=>e.type==='T');

        if(hasMI) el.classList.add('stage-mi');
        if(hasT) el.classList.add('stage');

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = hasMI ? '🏥' : '📚';
        el.appendChild(icon);

        el.addEventListener('click', ()=> openModal(key, events));
      }

      daysGrid.appendChild(el);
    }

    monthCard.appendChild(daysGrid);
    yearGrid.appendChild(monthCard);
  });
}

function openModal(key, events){
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  const dateObj = parseDate(key);
  const fullDate = formatFullDate(dateObj);
  const dayName = DAYS_FR[dateObj.getDay()];

  let html = `
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="modal-icon">${events.some(e=>e.type==='MI') ? '🏥' : '📚'}</div>
    <h2>${dayName}</h2>
    <div class="full-date">${fullDate}</div>
  `;

  const seen = new Set();
  events.forEach(ev => {
    const uid = ev.place + '|' + ev.type;
    if(seen.has(uid)) return;
    seen.add(uid);

    let emoji = '📚', label = 'Spécialité ' + ev.label;
    if(ev.type === 'MI'){ emoji = '🏥'; label = 'Médecine Interne'; }

    html += `
      <div class="info-line">
        <span class="emoji">${emoji}</span>
        <div>
          <span class="label">${label}</span>
          <span class="value">${ev.place}</span>
        </div>
      </div>
    `;
  });

  content.innerHTML = html;
  overlay.classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

renderFullYear();
</script>
</body>
</html>
